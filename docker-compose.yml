name: hangarae

services:
  app:
    image: ${HANGARAE_IMAGE}
    container_name: hangarae-app
    restart: unless-stopped

    ports:
      - "100.66.12.112:8081:8080"

    env_file:
      - ./storage.env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_URL: jdbc:mysql://100.66.133.99:3306/hangarae
      SERVER_FORWARD_HEADERS_STRATEGY: framework # 프로젝트마다 경로 다르게 받게 하기 위함
      PROD_DB_USERNAME: hangarae_app
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SCHOOL_NOTICE_ENABLED: "true"
      SCHOOL_NOTICE_RUN_ON_STARTUP: "true" # 백필 끝나면 false
      JEV_ENABLED: "true"
      GEMINI_ENABLED: "false" # 백필 끝나면 true
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
      TZ: Asia/Seoul

    mem_limit: 1g

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"