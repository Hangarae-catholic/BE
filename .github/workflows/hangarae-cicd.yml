name: Hangarae Home Server CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hangarae-home-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # JAR 빌드 및 Docker 이미지 게시
  build:
    name: Build and Test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build executable JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test bootJar
          test -s build/libs/hangarae.jar

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hangarae:sha-${{ github.sha }}

  # 이미지 게시 후 배포
  deploy:
    name: Deploy to Home Server
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:hangarae-ci

      - name: Prepare deployment variables
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HANGARAE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hangarae:sha-${{ github.sha }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          test -s docker-compose.yml

          names=(DOCKERHUB_USERNAME DOCKERHUB_TOKEN HANGARAE_IMAGE PROD_DB_PASSWORD JWT_SECRET)
          DEPLOY_PAYLOAD="$(
            {
              for name in "${names[@]}"; do
                # 필수 환경변수 누락 확인
                if [[ -z "${!name}" ]]; then
                  echo "필수 환경변수 누락: $name" >&2
                  exit 1
                fi

                # 비밀값의 특수문자가 명령어로 해석되지 않도록 처리
                printf 'export %s=%q\n' "$name" "${!name}"
              done

              printf 'export COMPOSE_FILE_B64=%q\n' "$(base64 -w 0 docker-compose.yml)"
            } | base64 -w 0
          )"

          echo "::add-mask::$DEPLOY_PAYLOAD"
          printf 'DEPLOY_PAYLOAD=%s\n' "$DEPLOY_PAYLOAD" >> "$GITHUB_ENV"

      # 호스트 키 검증 후 배포용 SSH 키로 접속
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.66.12.112
          username: promevious
          port: 22
          key: ${{ secrets.HANGARAE_SSH_PRIVATE_KEY }}
          fingerprint: SHA256:fhMly2/oBnITaDynCpQJEFuT1oBpzpJmggxRvPnjYTM
          timeout: 30s
          command_timeout: 12m
          envs: DEPLOY_PAYLOAD
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            set +x
            umask 077

            eval "$(printf '%s' "$DEPLOY_PAYLOAD" | base64 --decode)"
            unset DEPLOY_PAYLOAD

            mkdir -p /home/promevious/services/apps/hangarae
            cd /home/promevious/services/apps/hangarae
            printf '%s' "$COMPOSE_FILE_B64" | base64 --decode > docker-compose.yml
            unset COMPOSE_FILE_B64

            export COMPOSE_DISABLE_ENV_FILE=1

            export DOCKER_CONFIG
            DOCKER_CONFIG="$(mktemp -d /tmp/hangarae-docker.XXXXXX)"
            trap 'rm -f -- "$DOCKER_CONFIG/config.json"; rmdir -- "$DOCKER_CONFIG"' EXIT

            docker compose -f docker-compose.yml config --quiet
            printf '%s\n' "$DOCKERHUB_TOKEN" | docker login docker.io \
              --username "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN

            # 새 이미지 다운로드 후 앱 실행
            docker compose -f docker-compose.yml pull app
            docker compose -f docker-compose.yml up -d --wait --wait-timeout 300 app

            # 최종 컨테이너 상태 확인
            docker compose -f docker-compose.yml ps
            DEPLOY